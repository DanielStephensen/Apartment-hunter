name: Scrape apartments

on:
  schedule:
    # GitHub cron is UTC and has no daylight-saving awareness, so these land at
    # 11:00/18:00 Copenhagen in summer and 10:00/17:00 in winter. The one-hour
    # drift is not worth correcting: GitHub dispatches scheduled events on a
    # best-effort basis and in practice runs this workflow hours late, so there
    # is no wall-clock hour a guard step could match. It runs when it runs.
    - cron: "0 9 * * *" # 11:00 CEST / 10:00 CET
    - cron: "0 16 * * *" # 18:00 CEST / 17:00 CET
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # commit the updated CSV back to the repo
  pages: write # publish the page
  id-token: write # required by actions/deploy-pages

concurrency:
  group: apartment-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover tests

      - name: Scrape
        # Without SMTP_USER/SMTP_PASSWORD the run simply scrapes and sends
        # nothing, so the workflow still works before the secrets are added.
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: python -m apartment_hunter

      - name: Commit the results
        run: |
          git config user.name "apartment-hunter"
          git config user.email "actions@github.com"
          # The CSV is the dedup memory and must persist between runs; the page
          # is committed alongside it so the repo always shows the current
          # state, and so the daily commit keeps the schedule from being
          # disabled for inactivity.
          git add data/listings.csv docs/
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Listings for $(TZ=Europe/Copenhagen date +%F)"
            git push
          fi

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
